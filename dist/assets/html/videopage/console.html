<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>流集 - 视频管理</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M3 7.5c2.5-3 5-3 7.5 0s5 3 7.5 0' fill='none' stroke='%23FFB74D' stroke-width='2.2' stroke-linecap='round'/><path d='M3 12c2.5-3 5-3 7.5 0s5 3 7.5 0' fill='none' stroke='%23FF9800' stroke-width='2.4' stroke-linecap='round'/><path d='M3 16.5c2.5-3 5-3 7.5 0s5 3 7.5 0' fill='none' stroke='%23E65100' stroke-width='2.2' stroke-linecap='round'/></svg>">
<link rel="stylesheet" href="/assets/css/common.css">
<link rel="stylesheet" href="/assets/css/lib.css">
<link rel="stylesheet" href="/assets/css/videoConsole.css">
</head>
<body>

<section id="screenVideo" class="screen">
  <header class="topbar">
    <button class="icon-btn" id="btnHome" title="返回主页"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg></button>
    <div class="tb-brand">
      <svg class="logo-disc" viewBox="0 0 24 24">
        <path d='M3 7.5c2.5-3 5-3 7.5 0s5 3 7.5 0' fill='none' stroke='#FFB74D' stroke-width='2.2' stroke-linecap='round'/>
        <path d='M3 12c2.5-3 5-3 7.5 0s5 3 7.5 0' fill='none' stroke='#FF9800' stroke-width='2.4' stroke-linecap='round'/>
        <path d='M3 16.5c2.5-3 5-3 7.5 0s5 3 7.5 0' fill='none' stroke='#E65100' stroke-width='2.2' stroke-linecap='round'/>
      </svg>
      <span class="tb-name">流集</span><span class="crumb mono">/ <b>视频管理</b></span>
    </div>
    <div class="topbar-right">
      <button id="btnVideoSetting" class="btn" title="片库设置">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        设置
      </button>
      <button id="btnVideoSync" class="btn" title="FTP同步">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        同步
      </button>
      <button class="icon-btn js-theme" title="切换浅色 / 深色模式">
        <svg class="ic i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>
        <svg class="ic i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <main class="video-main">
    <div class="video-stats" id="videoStats">
      <div class="video-stat"><div><div class="v"><span id="vsCount">0</span><small>个</small></div><div class="k">视频总数</div></div></div>
      <div class="video-stat"><div><div class="v"><span id="vsSize">0</span><small>GB</small></div><div class="k">占用空间</div></div></div>
      <div class="video-stat"><div><div class="v"><span id="vsFormats">0</span><small>种</small></div><div class="k">格式类型</div></div></div>
      <div class="video-stat"><div><div class="v"><span id="vsDays">0</span><small>天</small></div><div class="k">跨越天数</div></div></div>
    </div>

    <div class="img-tabs">
      <button class="img-tab on" data-tab="lib">片库 <span class="cnt" id="cntLib">0</span></button>
      <button class="img-tab" data-tab="bin">回收站 <span class="cnt" id="cntBin">0</span></button>
    </div>

    <div class="video-toolbar">
      <div class="video-toolbar-left">
        <div class="sort-dropdown" id="sortDropdown">
          <button class="sort-dropdown-trigger" id="sortTrigger">
            <span id="sortLabel">日期</span> <span class="sort-arrow" id="sortArrow">↓</span>
            <svg class="sort-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="sort-dropdown-menu hidden" id="sortMenu">
            <div class="sort-dropdown-item active" data-field="date">日期</div>
            <div class="sort-dropdown-item" data-field="size">大小</div>
            <div class="sort-dropdown-item" data-field="name">名称</div>
          </div>
        </div>
      </div>
      <div class="video-toolbar-right">
        <button class="btn sm" id="btnBatchMode">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          批量
        </button>
      </div>
    </div>

    <div id="videoContent"></div>

    <div class="video-empty hidden" id="videoEmpty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><polygon points="10,8 16,12 10,16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h3>暂无视频</h3>
      <p>扫描视频目录后，视频将按日期分组显示在此处</p>
    </div>
    <div class="video-empty hidden" id="videoBinEmpty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14"/></svg>
      <h3>回收站为空</h3>
      <p>已删除的视频会出现在这里</p>
    </div>
  </main>
</section>

<!-- lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose" title="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  <button class="lb-nav lb-prev" id="lbPrev" title="上一个"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
  <button class="lb-nav lb-next" id="lbNext" title="下一个"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
  <span class="lb-counter" id="lbCounter"></span>
  <div class="lb-detail">
    <button class="lb-detail-btn" id="lbDetailBtn" title="视频详情"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></button>
    <div class="lb-detail-panel" id="lbDetailPanel">
      <div class="lb-detail-row"><span class="k">文件名</span><span class="v" id="lbDName">-</span></div>
      <div class="lb-detail-row"><span class="k">格式</span><span class="v" id="lbDExt">-</span></div>
      <div class="lb-detail-row"><span class="k">分辨率</span><span class="v" id="lbDRes">-</span></div>
      <div class="lb-detail-row"><span class="k">大小</span><span class="v" id="lbDSize">-</span></div>
      <div class="lb-detail-row"><span class="k">修改日期</span><span class="v" id="lbDDate">-</span></div>
      <div class="lb-detail-row"><span class="k">路径</span><span class="v" id="lbDPath">-</span></div>
    </div>
  </div>
  <div class="lb-video-wrap" id="lbVideoWrap"></div>
  <div class="lb-info">
    <div class="lb-fname" id="lbFname"></div>
    <div class="lb-meta">
      <span id="lbSize"></span>
      <span id="lbRes"></span>
      <span id="lbDate"></span>
    </div>
  </div>
</div>

<!-- batch bar -->
<div class="video-batch-bar" id="videoBatchBar">
  <div class="video-batch-left">
    <button class="btn sm" id="btnBatchCheckAll">
      <span class="check-icons"><svg class="ic ic-check-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/></svg><svg class="ic ic-check-some" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor"/></svg><svg class="ic ic-check-all" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><polyline points="9 11 11 13 15 9"/></svg></span>
      全选
    </button>
    <span class="video-batch-count">已选 <b id="batchSelCount">0</b> 个</span>
  </div>
  <div class="video-batch-actions">
    <button class="btn btn-outline sm" id="btnBatchDelete">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M16 6v10a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
      删除
    </button>
    <button class="btn sm" id="btnBatchCancel">取消</button>
  </div>
</div>

<!-- bin batch bar -->
<div class="video-batch-bar" id="videoBinBatchBar">
  <div class="video-batch-left">
    <button class="btn sm" id="btnBinBatchCheckAll">
      <span class="check-icons"><svg class="ic ic-check-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/></svg><svg class="ic ic-check-some" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor"/></svg><svg class="ic ic-check-all" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><polyline points="9 11 11 13 15 9"/></svg></span>
      全选
    </button>
    <span class="video-batch-count">已选 <b id="binBatchSelCount">0</b> 个</span>
  </div>
  <div class="video-batch-actions">
    <button class="btn btn-outline sm" id="btnBinBatchRestore">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-7.7L3 8"/><path d="M3 3v5h5"/></svg>
      恢复
    </button>
    <button class="btn btn-outline sm btn-danger" id="btnBinBatchPurge">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14"/></svg>
      彻底删除
    </button>
    <button class="btn sm" id="btnBinBatchCancel">取消</button>
  </div>
</div>

<!-- confirm modal -->
<div class="overlay" id="ovConfirm">
  <div class="modal" role="alertdialog" aria-modal="true">
    <div class="modal-head">
      <div class="m-ic warn"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg></div>
      <div style="min-width:0;flex:1"><h3 id="cTitle">确认操作</h3><p id="cMsg"></p></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-primary" id="btnConfirmOk">确认</button>
      <button class="btn btn-ghost" id="btnConfirmCancel">取消</button>
    </div>
  </div>
</div>

<!-- sync modal -->
<div class="overlay" id="ovSync">
  <div class="modal sync-modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <div class="m-ic sync"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></div>
      <div style="min-width:0;flex:1"><h3>FTP 同步</h3><p id="syncSubtitle">连接远程 FTP 服务器，同步视频文件</p></div>
      <button class="btn btn-ghost sm" id="btnSyncClose" style="margin-left:auto">✕</button>
    </div>
    <div class="sync-steps">
      <div class="sync-step" data-step="1" id="syncStep1"><div class="sync-step-label">① 连接</div></div>
      <div class="sync-step" data-step="2" id="syncStep2"><div class="sync-step-label">② 选目录</div></div>
      <div class="sync-step" data-step="3" id="syncStep3"><div class="sync-step-label">③ 对比</div></div>
      <div class="sync-step" data-step="4" id="syncStep4"><div class="sync-step-label">④ 执行</div></div>
    </div>
    <div class="modal-body sync-body">
      <div class="sync-panel" id="syncPanel1">
        <div class="m-field"><label>FTP 地址 <i>*</i></label><input id="syncIp" type="text" placeholder="例如 192.168.1.100" autocomplete="off"></div>
        <div class="m-field"><label>端口</label><input id="syncPort" type="number" placeholder="2121" value="2121" autocomplete="off"></div>
        <div class="m-field"><label>用户名</label><input id="syncUser" type="text" placeholder="Admin" value="Admin" autocomplete="off"></div>
        <div class="m-field"><label>密码</label><input id="syncPass" type="password" placeholder="可选" autocomplete="off"></div>
        <div class="sync-conn-status" id="syncConnStatus"></div>
      </div>
      <div class="sync-panel hidden" id="syncPanel2">
        <div class="sync-dir-bar">
          <div class="sync-breadcrumb" id="syncBreadcrumb"></div>
          <div class="sync-dir-filter" id="syncDirFilterWrap">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input id="syncDirFilter" type="text" placeholder="过滤目录…">
          </div>
        </div>
        <div class="sync-dir-list" id="syncDirList"><div class="sync-dir-loading">加载中...</div></div>
      </div>
      <div class="sync-panel hidden" id="syncPanel3">
        <div class="sync-compare-loading hidden" id="syncCompareLoading"><span class="spin"></span> 正在对比...</div>
        <div class="sync-compare-result hidden" id="syncCompareResult">
          <div class="sync-dir-bar">
            <span class="sync-dir-side active" id="syncDirLeft"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg> 本地</span>
            <button class="sync-dir-toggle" id="syncDirToggle" title="切换方向"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="7.5 21 3 16.5 7.5 12"/><line x1="3" y1="16.5" x2="16.5" y2="16.5"/><polyline points="16.5 3 21 7.5 16.5 12"/><line x1="21" y1="7.5" x2="7.5" y2="7.5"/></svg></button>
            <span class="sync-dir-side" id="syncDirRight"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg> FTP服务器</span>
          </div>
          <div class="sync-file-table-wrap">
            <div class="sync-file-table-head">
              <button class="sync-check-btn" id="syncCheckAll" data-state="none" title="全选">
                <svg class="ic ic-check-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/></svg>
                <svg class="ic ic-check-some" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor"/></svg>
                <svg class="ic ic-check-all" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><polyline points="9 11 11 13 15 9"/></svg>
              </button>
              <div class="sync-stats-pills">
                <span class="sync-pill upload">↑ <b id="syncUploadCount">0</b> 上传</span>
                <span class="sync-pill download">↓ <b id="syncDownloadCount">0</b> 下载</span>
                <span class="sync-pill same">✓ <b id="syncUnchangedCount">0</b> 未变</span>
              </div>
              <span class="sync-selected-hint" id="syncSelectedHint">已选 <b>0</b> / <b>0</b></span>
            </div>
            <div class="sync-file-items" id="syncFileItems"></div>
          </div>
        </div>
      </div>
      <div class="sync-panel hidden" id="syncPanel4">
        <div class="sync-execute-status" id="syncExecuteStatus"><span class="spin"></span> 正在执行同步...</div>
        <div class="sync-execute-done hidden" id="syncExecuteDone">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:48px;height:48px;color:var(--teal)"><path d="M22 11.1V12a10 10 0 1 1-5.9-9.1"/><path d="m8 12 3 3 6-6"/></svg>
          <h3>同步完成</h3>
          <p id="syncExecuteSummary"></p>
        </div>
      </div>
    </div>
    <div class="modal-foot" id="syncFoot">
      <button class="btn btn-ghost hidden" id="btnSyncPrev" style="margin-top:0">上一步</button>
      <button class="btn btn-primary hidden" id="btnSyncTest" style="margin-top:0">测试连接</button>
      <button class="btn btn-primary hidden" id="btnSyncNext" style="margin-top:0">下一步</button>
      <button class="btn btn-primary hidden" id="btnSyncCompare" style="margin-top:0">开始对比</button>
      <button class="btn btn-primary hidden" id="btnSyncExecute" style="margin-top:0">执行同步</button>
      <button class="btn btn-outline hidden" id="btnSyncDone" style="margin-top:0">完成</button>
    </div>
  </div>
</div>

<div id="toasts"></div>

<script src="/assets/js/common.js"></script>
<script src="/assets/js/lib.js"></script>
<script src="/assets/js/videoConsole.js"></script>
</body>
</html>
