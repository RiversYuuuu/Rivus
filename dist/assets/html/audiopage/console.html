<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>流集 - 本地多媒体管家</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M3 7.5c2.5-3 5-3 7.5 0s5 3 7.5 0' fill='none' stroke='%2364B5F6' stroke-width='2.2' stroke-linecap='round'/><path d='M3 12c2.5-3 5-3 7.5 0s5 3 7.5 0' fill='none' stroke='%232196F3' stroke-width='2.4' stroke-linecap='round'/><path d='M3 16.5c2.5-3 5-3 7.5 0s5 3 7.5 0' fill='none' stroke='%230D47A1' stroke-width='2.2' stroke-linecap='round'/></svg>">
<link rel="stylesheet" href="/assets/css/common.css">
<link rel="stylesheet" href="/assets/css/lib.css">
<link rel="stylesheet" href="/assets/css/player.css">
</head>
<body>

<section id="screenLib" class="screen">
  <header class="topbar">
    <button class="icon-btn" id="btnHome" title="返回主页"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg></button>
    <div class="tb-brand">
      <svg class="logo-disc" viewBox="0 0 24 24">
        <path d='M3 7.5c2.5-3 5-3 7.5 0s5 3 7.5 0' fill='none' stroke='#64B5F6' stroke-width='2.2' stroke-linecap='round'/>
        <path d='M3 12c2.5-3 5-3 7.5 0s5 3 7.5 0' fill='none' stroke='#2196F3' stroke-width='2.4' stroke-linecap='round'/>
        <path d='M3 16.5c2.5-3 5-3 7.5 0s5 3 7.5 0' fill='none' stroke='#0D47A1' stroke-width='2.2' stroke-linecap='round'/>
      </svg>
      <span class="tb-name">流集</span><span class="crumb mono">/ <b>音频管理</b></span>
    </div>
    <div class="search-box">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="搜索歌曲、歌手或专辑…" autocomplete="off">
      <kbd>/</kbd>
    </div>
    <div class="seg" id="scopeSeg">
      <button data-scope="all" class="on">全部</button>
      <button data-scope="title">歌名</button>
      <button data-scope="artist">歌手</button>
      <button data-scope="album">专辑</button>
    </div>
    <button id="btnRescan" class="btn" title="重新扫描目录">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></svg>
      重新扫描
    </button>
    <button id="btnUpload" class="btn" title="上传音频文件">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      上传
    </button>
    <input type="file" id="fileUpload" accept=".mp3,.flac" multiple hidden>
    <button class="icon-btn js-theme" title="切换浅色 / 深色模式">
      <svg class="ic i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>
      <svg class="ic i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <main class="lib-main">
    <div class="toolbar">
      <div class="tabs">
        <button class="tab on" data-tab="lib">曲库 <span class="cnt" id="cntLib">0</span></button>
        <button class="tab" data-tab="bin">回收站 <span class="cnt" id="cntBin">0</span></button>
      </div>
      <div class="result-info" id="resultInfo"></div>
    </div>

    <div class="stats-strip">
      <div class="stat"><div class="v"><span id="stCount">0</span><small>首</small></div><div class="k">歌曲总数</div></div>
      <div class="stat"><div class="v"><span id="stSize">0</span><small>GB</small></div><div class="k">占用空间</div></div>
      <div class="stat"><div class="v"><span id="stAlbum">0</span><small>张</small></div><div class="k">专辑数量</div></div>
      <div class="stat"><div class="v"><span id="stBin">0</span><small>首</small></div><div class="k">回收站</div></div>
    </div>

    <div class="table-card">
      <div class="table-scroll">
        <table>
          <thead id="thead">
            <tr>
              <th class="c-idx">#</th>
              <th data-sort="title" class="sortable">歌曲名<span class="arr"></span></th>
              <th data-sort="artist" class="sortable">歌手<span class="arr"></span></th>
              <th class="h-album">专辑</th>
              <th class="h-fmt">格式</th>
              <th class="h-size">大小</th>
              <th class="h-fname">文件名</th>
              <th class="h-md5">MD5</th>
              <th style="text-align:center">操作</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="empty hidden" id="emptyBox"></div>
      <div class="pager-bar">
        <span class="pg-count mono" id="pgCount"></span>
        <div class="pg-center">
          <button class="pg-locate" id="plLocate" title="定位到当前播放歌曲">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="8" stroke-dasharray="9 3.57" transform="rotate(13 12 12)"/></svg>
          </button>
          <div class="pg-nums" id="pgNums"></div>
        </div>
        <div class="pg-right">
          <span class="pg-size-label">每页</span>
          <select class="pg-size" id="pgSize"><option value="10">10</option><option value="20">20</option><option value="50">50</option></select>
          <span class="pg-size-label">条</span>
          <span class="pg-jump">跳至 <input id="pgJump" type="number" min="1" class="pg-jump-input"> 页</span>
        </div>
      </div>
    </div>
  </main>
</section>

<!-- ============ 编辑弹窗 ============ -->
<div class="overlay" id="ovEdit">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <div class="m-ic edit"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></div>
      <div style="min-width:0;flex:1"><h3>编辑歌曲信息</h3><div class="m-path" id="editPath"></div></div>
    </div>
    <form id="editForm">
      <div class="modal-body">
        <div class="m-field"><label>歌名 <i>*</i></label><input id="eTitle" type="text" maxlength="80" autocomplete="off"></div>
        <div class="m-field"><label>歌手</label><input id="eArtist" type="text" maxlength="60" autocomplete="off"></div>
        <div class="m-field"><label>专辑</label><input id="eAlbum" type="text" maxlength="60" autocomplete="off"></div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" id="btnEditCancel">取消</button>
        <button type="button" class="btn btn-smart" id="btnScrape" style="margin-top:0">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/><path d="M8.5 11h5M11 8.5v5"/></svg>
          智能识别
        </button>
        <button type="submit" class="btn btn-primary" id="btnEditSave" style="margin-top:0">保存修改</button>
      </div>
    </form>
  </div>
</div>

<!-- ============ 歌词弹窗 ============ -->
<div class="overlay" id="ovLyric">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <div class="m-ic edit"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg></div>
      <div style="min-width:0;flex:1"><h3>歌词管理</h3><p id="lyricSongName"></p></div>
    </div>
    <div class="modal-body" style="padding-bottom:8px">
      <div id="lyricActions" style="display:flex;flex-direction:column;gap:12px">
        <button class="btn full big" id="btnLyricUpload" style="margin-top:0">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          本地上传
        </button>
        <button class="btn btn-smart full big" id="btnLyricFetch" style="margin-top:0">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/><path d="M8.5 11h5M11 8.5v5"/></svg>
          智能搜索
        </button>
      </div>
      <div id="lyricPreview" class="hidden">
        <div style="font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:7px">歌词预览</div>
        <div id="lyricPreviewText" style="background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:12px 13px;font-size:13px;color:var(--ink);max-height:220px;overflow-y:auto;white-space:pre-wrap;line-height:1.7;font-family:'JetBrains Mono','Cascadia Code','Consolas',monospace"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-ghost" id="btnLyricCancel">取消</button>
      <button type="button" class="btn btn-primary hidden" id="btnLyricConfirm" style="margin-top:0">确认上传</button>
    </div>
  </div>
</div>

<!-- ============ 确认弹窗 ============ -->
<div class="overlay" id="ovConfirm">
  <div class="modal" role="alertdialog" aria-modal="true">
    <div class="modal-head">
      <div class="m-ic warn"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg></div>
      <div style="min-width:0;flex:1"><h3 id="cTitle">确认操作</h3><p id="cMsg"></p></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-primary" id="btnConfirmOk">确认</button>
      <button class="btn btn-ghost" id="btnConfirmCancel">取消</button>
    </div>
  </div>
</div>

<div id="toasts"></div>

<!-- ============ 播放器 ============ -->
<div id="playerBar">
  <div class="pl-tab" id="plTab" title="展开播放器">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
  </div>
  <div class="pl-info">
    <div class="pl-title" id="plTitle">未选择歌曲</div>
    <div class="pl-artist" id="plArtist">--</div>
  </div>
  <div class="pl-lyric" id="plLyric">
    <div class="lyric-scroll" id="lyricScroll">
      <div class="lyric-line lyric-cur" id="lyricCur"></div>
      <div class="lyric-line lyric-next" id="lyricNext"></div>
      <div class="lyric-line lyric-next2" id="lyricNext2"></div>
    </div>
  </div>
  <div class="pl-ctrls">
    <button class="pl-btn" id="plMode" title="顺序播放">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
    </button>
    <button class="pl-btn" id="plPrev" title="上一首">
      <svg class="ic" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,12 15,3 15,21"/><rect x="17" y="3" width="3" height="18"/></svg>
    </button>
    <button class="pl-btn play" id="plPlay" title="播放">
      <svg class="ic" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,3 20,12 6,21"/></svg>
    </button>
    <button class="pl-btn" id="plNext" title="下一首">
      <svg class="ic" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 15,12 5,21"/><rect x="17" y="3" width="3" height="18"/></svg>
    </button>
  </div>
  <div class="pl-prog">
    <span class="pl-time" id="plCurTime">0:00</span>
    <input type="range" id="plProgress" min="0" max="100" value="0">
    <span class="pl-time" id="plDuration">0:00</span>
  </div>
  <button class="pl-btn" id="plVolIcon" title="静音">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
  </button>
  <button class="pl-toggle" id="plToggle" title="隐藏播放器">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
  </button>
  <audio id="plAudio" preload="auto"></audio>
</div>

<script src="/assets/js/common.js"></script>
<script src="/assets/js/lib.js"></script>
<script src="/assets/js/player.js"></script>
</body>
</html>
