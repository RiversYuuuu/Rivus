<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>流集 - 图片管理</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M3 7.5c2.5-3 5-3 7.5 0s5 3 7.5 0' fill='none' stroke='%2381C784' stroke-width='2.2' stroke-linecap='round'/><path d='M3 12c2.5-3 5-3 7.5 0s5 3 7.5 0' fill='none' stroke='%234CAF50' stroke-width='2.4' stroke-linecap='round'/><path d='M3 16.5c2.5-3 5-3 7.5 0s5 3 7.5 0' fill='none' stroke='%232E7D32' stroke-width='2.2' stroke-linecap='round'/></svg>">
<link rel="stylesheet" href="/assets/css/common.css">
<link rel="stylesheet" href="/assets/css/imageConsole.css">
</head>
<body>

<section id="screenImage" class="screen">
  <header class="topbar">
    <button class="icon-btn" id="btnHome" title="返回主页"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg></button>
    <div class="tb-brand">
      <svg class="logo-disc" viewBox="0 0 24 24">
        <path d='M3 7.5c2.5-3 5-3 7.5 0s5 3 7.5 0' fill='none' stroke='#81C784' stroke-width='2.2' stroke-linecap='round'/>
        <path d='M3 12c2.5-3 5-3 7.5 0s5 3 7.5 0' fill='none' stroke='#4CAF50' stroke-width='2.4' stroke-linecap='round'/>
        <path d='M3 16.5c2.5-3 5-3 7.5 0s5 3 7.5 0' fill='none' stroke='#2E7D32' stroke-width='2.2' stroke-linecap='round'/>
      </svg>
      <span class="tb-name">流集</span><span class="crumb mono">/ <b>图片管理</b></span>
    </div>
    <div class="topbar-right">
      <button id="btnImgSetting" class="btn" title="图库设置">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        设置
      </button>
      <button class="icon-btn js-theme" title="切换浅色 / 深色模式">
        <svg class="ic i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>
        <svg class="ic i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <main class="img-main">
    <div class="img-stats" id="imgStats">
      <div class="img-stat"><div><div class="v"><span id="isCount">0</span><small>张</small></div><div class="k">图片总数</div></div></div>
      <div class="img-stat"><div><div class="v"><span id="isSize">0</span><small>GB</small></div><div class="k">占用空间</div></div></div>
      <div class="img-stat"><div><div class="v"><span id="isFormats">0</span><small>种</small></div><div class="k">格式类型</div></div></div>
      <div class="img-stat"><div><div class="v"><span id="isDays">0</span><small>天</small></div><div class="k">跨越天数</div></div></div>
    </div>

    <div id="imgContent"></div>

    <div class="img-empty hidden" id="imgEmpty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
      <h3>暂无图片</h3>
      <p>扫描图片目录后，图片将按日期分组显示在此处</p>
    </div>
  </main>
</section>

<!-- lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose" title="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  <button class="lb-nav lb-prev" id="lbPrev" title="上一张"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
  <button class="lb-nav lb-next" id="lbNext" title="下一张"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
  <span class="lb-counter" id="lbCounter"></span>
  <div class="lb-detail">
    <button class="lb-detail-btn" id="lbDetailBtn" title="图片详情"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></button>
    <div class="lb-detail-panel" id="lbDetailPanel">
      <div class="lb-detail-row"><span class="k">文件名</span><span class="v" id="lbDName">-</span></div>
      <div class="lb-detail-row"><span class="k">格式</span><span class="v" id="lbDExt">-</span></div>
      <div class="lb-detail-row"><span class="k">大小</span><span class="v" id="lbDSize">-</span></div>
      <div class="lb-detail-row"><span class="k">修改日期</span><span class="v" id="lbDDate">-</span></div>
      <div class="lb-detail-row"><span class="k">路径</span><span class="v" id="lbDPath">-</span></div>
    </div>
  </div>
  <div class="lb-img-wrap">
    <img id="lbImg" src="" alt="">
    <div class="lb-info">
      <div class="lb-fname" id="lbFname"></div>
      <div class="lb-meta">
        <span id="lbSize"></span>
        <span id="lbDate"></span>
      </div>
    </div>
  </div>
</div>

<!-- batch bar -->
<div class="img-batch-bar" id="imgBatchBar">
  <div class="img-batch-left">
    <button class="btn sm" id="btnBatchCheckAll">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><polyline points="9 11 11 13 15 9"/></svg>
      全选
    </button>
    <span class="img-batch-count">已选 <b id="batchSelCount">0</b> 张</span>
  </div>
  <div class="img-batch-actions">
    <button class="btn btn-outline sm" id="btnBatchDelete">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M16 6v10a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
      删除
    </button>
    <button class="btn sm" id="btnBatchCancel">取消</button>
  </div>
</div>

<!-- confirm modal -->
<div class="overlay" id="ovConfirm">
  <div class="modal" role="alertdialog" aria-modal="true">
    <div class="modal-head">
      <div class="m-ic warn"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg></div>
      <div style="min-width:0;flex:1"><h3 id="cTitle">确认操作</h3><p id="cMsg"></p></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-primary" id="btnConfirmOk">确认</button>
      <button class="btn btn-ghost" id="btnConfirmCancel">取消</button>
    </div>
  </div>
</div>

<div id="toasts"></div>

<script src="/assets/js/common.js"></script>
<script src="/assets/js/imageConsole.js"></script>
</body>
</html>
