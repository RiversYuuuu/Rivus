<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>流集 - 本地多媒体管家</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><defs><linearGradient id='g' x1='3' y1='0' x2='18' y2='0' gradientUnits='userSpaceOnUse'><stop offset='0' stop-color='%2364B5F6'/><stop offset='.22' stop-color='%232196F3'/><stop offset='.45' stop-color='%2366BB6A'/><stop offset='.62' stop-color='%239CCC65'/><stop offset='.8' stop-color='%23FFCA45'/><stop offset='1' stop-color='%23FFB74D'/></linearGradient></defs><path d='M3 7.5c2.5-3 5-3 7.5 0s5 3 7.5 0' fill='none' stroke='url(%23g)' stroke-width='2.2' stroke-linecap='round'/><path d='M3 12c2.5-3 5-3 7.5 0s5 3 7.5 0' fill='none' stroke='url(%23g)' stroke-width='2.4' stroke-linecap='round'/><path d='M3 16.5c2.5-3 5-3 7.5 0s5 3 7.5 0' fill='none' stroke='url(%23g)' stroke-width='2.2' stroke-linecap='round'/></svg>">
<link rel="stylesheet" href="/assets/css/common.css">
<link rel="stylesheet" href="/assets/css/home.css">
</head>
<body>

<section id="screenHome" class="screen">
  <header class="home-top">
    <div class="tb-brand">
      <svg class="logo-disc" xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'>
        <defs>
          <linearGradient id='g' x1='3' y1='0' x2='18' y2='0' gradientUnits='userSpaceOnUse'>
            <stop offset='0' stop-color='#64B5F6'/><stop offset='.22' stop-color='#2196F3'/>
            <stop offset='.45' stop-color='#66BB6A'/><stop offset='.62' stop-color='#9CCC65'/>
            <stop offset='.8' stop-color='#FFCA45'/><stop offset='1' stop-color='#FFB74D'/>
          </linearGradient>
        </defs>
        <path d='M3 7.5c2.5-3 5-3 7.5 0s5 3 7.5 0' fill='none' stroke='url(#g)' stroke-width='2.2' stroke-linecap='round'/>
        <path d='M3 12c2.5-3 5-3 7.5 0s5 3 7.5 0' fill='none' stroke='url(#g)' stroke-width='2.4' stroke-linecap='round'/>
        <path d='M3 16.5c2.5-3 5-3 7.5 0s5 3 7.5 0' fill='none' stroke='url(#g)' stroke-width='2.2' stroke-linecap='round'/>
      </svg>
      <span class="tb-name">流集</span><span class="tb-ver mono">v0.3.0</span>
    </div>
    <div class="home-top-right">
      <button class="icon-btn js-theme" title="切换浅色 / 深色模式">
        <svg class="ic i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>
        <svg class="ic i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <div class="home-wrap">
    <div class="mod-head">
      <div><div class="overline">MODULES</div><h2 class="mod-title">选择管理模块</h2></div>
      <div class="mod-note mono">AUDIO · IMAGE · VIDEO</div>
    </div>

    <div class="mod-grid">
      <article class="mod-card mod-audio card" id="cardAudio" tabindex="0" role="button" aria-label="进入音频管理">
        <span class="status-chip warn" id="audioStatus">未初始化</span>
        <div class="mod-icon-row">
          <svg class="logo-disc" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="22" fill="var(--bg2)" stroke="var(--amber)" stroke-width="2"/><circle cx="24" cy="24" r="15" stroke="var(--line2)" stroke-width="1.5" stroke-dasharray="3 4"/><circle cx="24" cy="24" r="7" fill="var(--amber)"/><circle cx="24" cy="24" r="2.4" fill="var(--bg0)"/></svg>
          <div><h3>音频管理</h3><div class="mono mod-en">AUDIO</div></div>
        </div>
        <p class="mod-desc">扫描本地目录建立音频数据库，支持按歌名 / 歌手 / 专辑检索，并可编辑、删除与恢复条目。</p>
        <div class="audio-meta hidden" id="audioMeta">
          <div class="am"><b id="amCount">0</b><span>曲目</span></div>
          <div class="am"><b id="amSize">0</b><span>占用</span></div>
        </div>
        <div class="mod-foot">
          <span class="enter" id="audioEnter">进入模块 <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span>
        </div>
      </article>

      <article class="mod-card mod-image card" id="cardImage" tabindex="0" role="button" aria-label="进入图片管理">
        <span class="status-chip warn" id="imageStatus">未初始化</span>
        <div class="mod-icon-row">
          <svg class="logo-disc" viewBox="0 0 48 48" fill="none"><rect x="4" y="4" width="40" height="40" rx="6" fill="var(--bg2)" stroke="var(--green)" stroke-width="2"/><circle cx="16" cy="18" r="4" stroke="var(--line2)" stroke-width="1.5" fill="none"/><path d="M4 34 16 24 26 32 34 22 44 30" stroke="var(--green)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          <div><h3>图片管理</h3><div class="mono mod-en">IMAGE</div></div>
        </div>
        <p class="mod-desc">扫描本地目录建立图片数据库，支持按文件名 / 标签 / 时间线浏览，并可编辑、删除与恢复条目。</p>
        <div class="audio-meta hidden" id="imageMeta">
          <div class="am"><b id="imCount">0</b><span>图片</span></div>
          <div class="am"><b id="imSize">0</b><span>占用</span></div>
        </div>
        <div class="mod-foot">
          <span class="enter" id="imageEnter">进入模块 <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span>
        </div>
      </article>
      <article class="mod-card mod-video card" id="cardVideo" tabindex="0" role="button" aria-label="进入视频管理">
        <span class="status-chip warn" id="videoStatus">未初始化</span>
        <div class="mod-icon-row">
          <svg class="logo-disc" viewBox="0 0 48 48" fill="none"><rect x="4" y="4" width="40" height="40" rx="6" fill="var(--bg2)" stroke="var(--orange)" stroke-width="2"/><polygon points="20,14 34,24 20,34" fill="none" stroke="var(--orange)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <div><h3>视频管理</h3><div class="mono mod-en">VIDEO</div></div>
        </div>
        <p class="mod-desc">扫描本地目录建立视频数据库，支持按文件名 / 时长 / 分辨率检索，并可编辑、删除与恢复条目。</p>
        <div class="audio-meta hidden" id="videoMeta">
          <div class="am"><b id="vmCount">0</b><span>视频</span></div>
          <div class="am"><b id="vmSize">0</b><span>占用</span></div>
        </div>
        <div class="mod-foot">
          <span class="enter" id="videoEnter">进入模块 <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span>
        </div>
      </article>
    </div>
  </div>
</section>

<div id="toasts"></div>

<script src="/assets/js/common.js"></script>
<script src="/assets/js/home.js"></script>
</body>
</html>
