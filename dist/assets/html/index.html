<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>流集 - 本地多媒体管家</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M3 7.5c2.5-3 5-3 7.5 0s5 3 7.5 0' fill='none' stroke='%2364B5F6' stroke-width='2.2' stroke-linecap='round'/><path d='M3 12c2.5-3 5-3 7.5 0s5 3 7.5 0' fill='none' stroke='%232196F3' stroke-width='2.4' stroke-linecap='round'/><path d='M3 16.5c2.5-3 5-3 7.5 0s5 3 7.5 0' fill='none' stroke='%230D47A1' stroke-width='2.2' stroke-linecap='round'/></svg>">
<link rel="stylesheet" href="/assets/css/common.css">
<link rel="stylesheet" href="/assets/css/home.css">
</head>
<body>

<section id="screenHome" class="screen">
  <header class="home-top">
    <div class="tb-brand">
      <svg class="logo-disc" xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'>
        <path d='M3 7.5c2.5-3 5-3 7.5 0s5 3 7.5 0' fill='none' stroke='#64B5F6' stroke-width='2.2' stroke-linecap='round'/>
        <path d='M3 12c2.5-3 5-3 7.5 0s5 3 7.5 0' fill='none' stroke='#2196F3' stroke-width='2.4' stroke-linecap='round'/>
        <path d='M3 16.5c2.5-3 5-3 7.5 0s5 3 7.5 0' fill='none' stroke='#0D47A1' stroke-width='2.2' stroke-linecap='round'/>
      </svg>
      <span class="tb-name">流集</span><span class="tb-ver mono">v0.2.1</span>
    </div>
    <div class="home-top-right">
      <button class="icon-btn js-theme" title="切换浅色 / 深色模式">
        <svg class="ic i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>
        <svg class="ic i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <div class="home-wrap">
    <div class="mod-head">
      <div><div class="overline">MODULES</div><h2 class="mod-title">选择管理模块</h2></div>
      <div class="mod-note mono">AUDIO · IMAGE · VIDEO</div>
    </div>

    <div class="mod-grid">
      <article class="mod-card mod-audio card" id="cardAudio" tabindex="0" role="button" aria-label="进入音频管理">
        <span class="status-chip warn" id="audioStatus">未初始化</span>
        <div class="mod-icon-row">
          <svg class="logo-disc" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="22" fill="var(--bg2)" stroke="var(--amber)" stroke-width="2"/><circle cx="24" cy="24" r="15" stroke="var(--line2)" stroke-width="1.5" stroke-dasharray="3 4"/><circle cx="24" cy="24" r="7" fill="var(--amber)"/><circle cx="24" cy="24" r="2.4" fill="var(--bg0)"/></svg>
          <div><h3>音频管理</h3><div class="mono mod-en">AUDIO</div></div>
        </div>
        <p class="mod-desc">扫描本地目录建立音频数据库，支持按歌名 / 歌手 / 专辑检索，并可编辑、删除与恢复条目。</p>
        <div class="audio-meta hidden" id="audioMeta">
          <div class="am"><b id="amCount">0</b><span>曲目</span></div>
          <div class="am"><b id="amSize">0</b><span>占用</span></div>
        </div>
        <div class="mod-foot">
          <span class="enter" id="audioEnter">进入模块 <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span>
        </div>
      </article>

      <article class="mod-card mod-locked card" data-name="图片管理">
        <span class="lock-tag">即将上线</span>
        <div class="lock-ic"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></div>
        <h4>图片管理</h4><div class="mono mod-en">IMAGE · SOON</div>
        <p>图片收藏、标签分类与时间线浏览。</p>
      </article>
      <article class="mod-card mod-locked card" data-name="视频管理">
        <span class="lock-tag">即将上线</span>
        <div class="lock-ic"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.2"/><path d="m10 8 6 4-6 4z"/></svg></div>
        <h4>视频管理</h4><div class="mono mod-en">VIDEO · SOON</div>
        <p>视频库索引、章节标记与缩略图墙。</p>
      </article>
    </div>
  </div>
</section>

<div id="toasts"></div>

<script src="/assets/js/common.js"></script>
<script src="/assets/js/home.js"></script>
</body>
</html>
